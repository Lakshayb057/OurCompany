    <link rel="icon" type="image/png" href="/logo-icon.png" />
    
    <!-- Immediate theme session bootstrap (eliminates flash on refresh or hard refresh) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('codeverse-theme');
          var theme = saved;
          if (!theme) {
            var match = document.cookie.match(/(^|;)\s*codeverse_theme=([^;]+)/);
            if (match) theme = decodeURIComponent(match[2]);
          }
          // Default for first-time visitors is always light mode
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
