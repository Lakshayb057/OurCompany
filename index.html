  <!-- Immediate theme session bootstrap (eliminates flash on refresh or hard refresh) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('codrix-theme');
        var theme = saved;
        if (!theme) {
          var match = document.cookie.match(/(^|;)\s*codrix_theme=([^;]+)/);
          if (match) theme = decodeURIComponent(match[2]);
        }
        // Default for first-time visitors is always light mode
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
